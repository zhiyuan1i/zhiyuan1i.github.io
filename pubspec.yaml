name: zhiyuan_li_blog
description: Zhiyuan Li's Flutter blog with liquid glass design and Markdown content negotiation.
publish_to: none
version: 2.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_markdown_plus_latex: ^1.0.5
  go_router: ^18.0.2
  liquid_glass_easy: ^4.3.4
  flutter_svg: ^2.3.0
  markdown: ^7.3.1
  url_launcher: ^6.3.3
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  puppeteer: ^3.26.0

flutter:
  uses-material-design: true
  assets:
    - content/zh/
    - content/zh/posts/
    - content/en/
    - content/en/posts/
    - static/images/
    - static/icons/
